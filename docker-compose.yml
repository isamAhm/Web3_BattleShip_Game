version: "3.9"

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  server:
    build:
      context: ./apps/server
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGO_URI: mongodb://mongo:27017/battle-arena
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: ${SESSION_SECRET}
      SIWE_DOMAIN: ${SIWE_DOMAIN:-localhost:3000}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:3000}
      CHAIN_MODE: ${CHAIN_MODE:-simulated}
      RELAYER_PRIVATE_KEY: ${RELAYER_PRIVATE_KEY:-}
      REGISTRY_ADDRESS: ${REGISTRY_ADDRESS:-}
      RPC_URL: ${RPC_URL:-}
    depends_on:
      - mongo
      - redis

volumes:
  mongo_data:
  redis_data:
